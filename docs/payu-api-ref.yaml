  /api/v2_1/cards/lookup:
    post:
      tags:
        - Card
      summary: Retrieve Card Data
      security:
        - Bearer:
            - client_credentials
            - trusted_merchant
      description: |
        Card Data API allows you to retrieve the characteristics of a payment card (for example issuer, card country,
        card type and other attributes derived from payment organizations' BIN tables) before an actual order is
        created, without charging the card.

        **Note**: the request must contain either `token` or the `card` object — never both in the same 
        request.
      operationId: retrieve-card-data
      parameters:
        - name: Content-Type
          in: header
          description: Content type
          required: true
          schema:
            type: string
          style: simple
          example: application/json
        - name: Authorization
          in: header
          description: Auth token
          required: true
          schema:
            type: string
          style: simple
          example: Bearer 3e5cac39-7e38-4139-8fd6-30adc06a61bd
      requestBody:
        required: true
        description: 'Provide exactly one of the following fields: `token` or `card`.'
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Lookup by token
                  required:
                    - token
                  additionalProperties: false
                  properties:
                    token:
                      type: string
                      description: |
                        Card token value. Supported variants:
                        - SINGLE: always prefixed with `TOKD_`
                        - MULTI: prefixed with `TOKC_` (when retrieved using [Retrieve All Available Payment Methods](https://developers.payu.com/europe/api/#tag/Payment-Methods/operation/retrieve-payment-methods)) or `TOK_` (before card token activation and first order)
                        - SINGLE_LONGTERM: always prefixed with `TOK_`

                        For more details about creating tokens and supported variants,
                        see [Creating Tokens](https://developers.payu.com/europe/docs/payment-solutions/cards/tokenization/create-token/).

                        **Note**: Cannot be combined with the `card` object. Token or card object is required.
                      example: TOKD_1LPMUT4FPPSS9k46204E39L5S0k
                - type: object
                  title: Lookup by full card data
                  required:
                    - card
                  additionalProperties: false
                  properties:
                    card:
                      type: object
                      required:
                        - number
                        - expirationMonth
                        - expirationYear
                      additionalProperties: false
                      description: |
                        Full card data object for PCI DSS compliant merchants approved to process card data.

                        **Note**: Cannot be combined with `token` object.
                      properties:
                        number:
                          type: string
                          description: Card number as PAN or VAN (for example from Visa Tokenization Services, Mastercard MDES/SCOF, Google Pay, or Apple Pay).
                          example: '5100052384536834'
                        expirationMonth:
                          type: string
                          description: Card expiration month.
                          example: '8'
                        expirationYear:
                          type: string
                          description: Card expiration year.
                          example: '2029'
            examples:
              temporaryCardTokenSingle:
                summary: Temporary card token (SINGLE)
                value:
                  token: TOKD_1LPMUT4FPPSS9k46204E39L5S0k
              cardTokenMulti:
                summary: Card token (MULTI)
                value:
                  token: TOKC_1LPMUT4FPPSS9k46204E39L5S0k
              cardTokenMultiOrSingleLongTerm:
                summary: Card token (MULTI / SINGLE_LONGTERM)
                value:
                  token: TOK_1LPMUT4FPPSS9k46204E39L5S0k
              fullCardData:
                summary: Full card data (PAN / VAN) - PCI DSS merchants only
                value:
                  card:
                    number: '5100052384536834'
                    expirationMonth: '8'
                    expirationYear: '2029'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '408':
          $ref: '#/components/responses/408'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /api/v2_1/reports/{reportId}:
    get:
      tags:
        - Statements
      summary: Retrieve Statement
      description: |
        In response to retrieving a statement via the API, PayU returns a statement file (as indicated by the `Content-Type=application/octet-stream`) in the `Content-Disposition` header. You should take this attached binary data and save it with the same name and file extension. 

        For example, if the value of the `Content-Disposition` header is **attachment; filename="69e45495-bed9-4824-ace9-f7c191449bbb.zip"**, then you should save the attached data on your computer with the same name **69e45495-bed9-4824-ace9-f7c191449bbb.zip**.
      operationId: retrieve-statement
      security:
        - Basic: null
      parameters:
        - name: reportId
          in: path
          example: 4a3534fb-85b5-4f29-9da8-a6d73b34d528
          required: true
          content:
            application/json:
              schema:
                type: string
        - name: Content-Type
          in: header
          description: Content type
          required: true
          schema:
            type: string
          style: simple
          example: application/json
        - name: Authorization
          in: header
          description: Auth token
          required: true
          schema:
            type: string
          style: simple
          example: Bearer 3e5cac39-7e38-4139-8fd6-30adc06a61bd
  /api/v2_1/firms:
    post:
      tags:
        - Partner-Merchant-Registration
      summary: Create a Firm
      description: Create a Firm entity for your partner.
      operationId: create-a-firm
      security:
        - Bearer:
            - client_credentials
      parameters:
        - name: Content-Type
          in: header
          description: Content type
          required: true
          schema:
            type: string
          style: simple
          example: application/json
        - name: Authorization
          in: header
          description: Auth token with <code>grant_type=client_credentials</code>.
          required: true
          schema:
            type: string
          style: simple
          example: Bearer 3e5cac39-7e38-4139-8fd6-30adc06a61bd
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - taxId
                - taxIdType
                - cin
                - partnerId
                - businessArea
                - users
                - representatives
                - contactData
                - address
              properties:
                name:
                  type: string
                  description: Full legal name.
                  example: Test sp. z o.o.
                type:
                  type: string
                  description: Dictionary value - legal entity type. Dictionary is available [here](/europe/docs/collaboration/referral-program/#firm-types). For a firm which <code>address.country</code> code is not equal to <code>businessArea.origin</code> please use <b>FZ</b> type. <b>Providing accurate type speeds up merchant verification.</b>
                  example: SO
                taxId:
                  type: string
                  description: Tax identification.
                  example: '3771910486'
                taxIdType:
                  type: string
                  description: Type of tax identification.
                  enum:
                    - NIP
                    - VAT_EU
                    - TAX_ID
                  example: NIP
                cin:
                  type: string
                  description: Business identification. IČ (CZ) or REGON (PL).
                  example: '138237420'
                partnerId:
                  type: string
                  description: Your partner id.
                  example: egmcvdo5
                contactLanguage:
                  type: string
                  description: Preferred language for communication.
                  enum:
                    - EN
                    - PL
                    - CS
                    - RO
                  example: PL
                businessArea:
                  type: object
                  required:
                    - origin
                  description: Business area of the registered firm.
                  properties:
                    origin:
                      type: string
                      description: 'Denotes firm origin and applies validation and requirements for this origin. Currently only two values are available: <b>CZ</b> and <b>PL</b>. <b>It is still possible to register a firm which is incorporated outside of Czechia or Poland</b>.'
                      example: PL
                users:
                  type: array
                  description: Array of PayU panel users. At least 1 must be provided.
                  items:
                    type: object
                    required:
                      - name
                      - surname
                      - email
                      - role
                    properties:
                      name:
                        type: string
                        description: User's first name.
                        example: Jan
                      surname:
                        type: string
                        description: User's last name.
                        example: Nowak
                      email:
                        type: string
                        description: User's email.
                        example: jan.nowak@testowa.pl
                      phone:
                        type: string
                        description: User's phone number.
                        example: 123123123
                      role:
                        type: string
                        description: User's role.
                        enum:
                          - MANAGER
                          - USER
                        example: MANAGER
                representatives:
                  type: array
                  description: Array of firm legal representatives. At least 1 must be provided.
                  items:
                    type: object
                    required:
                      - name
                      - surname
                      - countryCode
                      - birthCountryCode
                    properties:
                      name:
                        type: string
                        description: Representative's first name.
                        example: Jan
                      surname:
                        type: string
                        description: Representative's last name.
                        example: Nowak
                      nin:
                        type: string
                        description: Representative's national identity number (PESEL). <b>Required only for Polish citizens</b>
                        example: 80010104578
                      countryCode:
                        type: string
                        description: Representative's citizenship. Must be a valid ISO 3166-1 two-letter code.
                        example: PL
                      birthDate:
                        type: string
                        format: RRRR-MM-DD
                        description: Representative's date of birth. <b>Required only for non-Polish citizens</b>
                        example: '2000-01-01'
                      birthCountryCode:
                        type: string
                        description: Country code of representative's birth country. Must be a valid ISO 3166-1 two-letter code.
                        example: pl
                contactData:
                  type: object
                  description: Object containing firm's contact details.
                  required:
                    - phone
                    - email
                  properties:
                    phone:
                      type: string
                      description: Firm's contact phone number.
                      example: 123123123
                    email:
                      type: string
                      description: Firm's contact email address.
                      example: biuro@testowa.pl
                technicalContactData:
                  type: object
                  description: Object containing firm's technical contact details (e.g. to the developer responsible for integration with PayU).
                  required: []
                address:
                  type: object
                  description: Firm's registration address.
                  required:
                    - street
                    - houseNo
                    - apartmentNo
                    - postalCode
                    - city
                    - countryCode
                  properties:
                    street:
                      type: string
                      description: Firm's registration address street.
                      example: Grunwaldzka
                    houseNo:
                      type: string
                      description: Firm's registration address house number.
                      example: 186
                    apartmentNo:
                      type: string
                      description: Firm's registration address apartment number.
                      example: 1
                    postalCode:
                      type: string
                      description: Firm's registration address postal code.
                      example: 61-166
                    city:
                      type: string
                      description: Firm's registration address city.
                      example: Poznań
                    countryCode:
                      type: string
                      description: Firm's registration address country code. Must be a valid ISO 3166-1 two-letter code.
                      example: PL
                correspondenceAddress:
                  type: object
                  description: Firm's correspondence address (<b>if other than registration address</b>). This object the same fields as address.
                  required:
                    - street
                    - houseNo
                    - apartmentNo
                    - postalCode
                    - city
                    - countryCode
                  properties:
                    street:
                      type: string
                      description: Firm's registration address street.
                      example: Grunwaldzka
                    houseNo:
                      type: string
                      description: Firm's registration address house number.
                      example: 186
                    apartmentNo:
                      type: string
                      description: Firm's registration address apartment number.
                      example: 1
                    postalCode:
                      type: string
                      description: Firm's registration address postal code.
                      example: 61-166
                    city:
                      type: string
                      description: Firm's registration address city.
                      example: Poznań
                    countryCode:
                      type: string
                      description: Firm's registration address country code. Must be a valid ISO 3166-1 two-letter code.
                      example: PL
      responses:
        '200':
          x-summary: OK
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  firmId:
                    type: string
                    description: Identifier that needs to be stored in your system and is used to create further entities for that firm.
                    example: KzXy4ZzD
        '401':
          x-summary: Unauthorized
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
