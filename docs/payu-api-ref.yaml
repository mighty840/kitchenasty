openapi: 3.1.0
info:
  version: 2.1.0
  title: PayU GPO Europe REST API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://poland.payu.com/wp-content/themes/global-website/assets/src/images/payu-logo.svg
  description: |-
    # Overview

    This reference is designed to assist you in effectively utilizing the PayU REST API to enhance your online payment capabilities. Whether you're running an e-commerce store or developing applications that require secure and seamless payment processing, our API offers a range of features to meet your needs.

    Our API offers a comprehensive set of endpoints to empower you with full control over your payment processes. With these endpoints, you can seamlessly create, capture, cancel, and retrieve orders, conduct payouts, and access essential reports.

    For more details on the integration, please refer to the official <a href="/europe/docs/">PayU documentation</a>. It provides comprehensive explanations, code samples, and best practices for seamless integration of the PayU API into your applications.

    ## Testing

    ### Production Environment

    For a basic integration, including only a redirection to PayU hosted payment page, it is perfectly enough to use the public test point of sale. However, if you would like to test a full set of endpoints, including e.g. refunds, consider registering for a sandbox account.

    **Public Test POS (point of sale)**

    | Key name                       |                            Value |
    | ------------------------------ | -------------------------------: |
    | POS ID (pos_id)                |                           145227 |
    | OAuth protocol - client_id     |                           145227 |
    | Second key (MD5)               | 13a980d4f851f3d9a1cfc792fb1f5e50 |
    | OAuth protocol - client_secret | 12f071174cb7eb79d4aac5bc2f07563f |

    ### Sandbox Environment

    Sandbox is an almost identical copy of PayU production system. It can be used for integration and testing purposes.

    **Public Test POS (Point of Sale)**

    Although it is best to <a href="https://registration-merch-prod.snd.payu.com/boarding/#/registerSandbox/" target="_blank">create your own account</a> to later be able to configure it as needed, you may also use a public sandbox test POS without registering:

    | Key name                       |                            Value |
    | ------------------------------ | -------------------------------: |
    | POS ID (pos_id)                |                           300746 |
    | OAuth protocol - client_id     |                           300746 |
    | Second key (MD5)               | b6ca15b0d1020e8094d9b5f8d163db54 |
    | OAuth protocol - client_secret | 2ee86a66e5d97e3fadc400c9f19b065d |

    The availability of the sandbox environment can be checked on the <a href="https://status.snd.payu.com/" target="_blank">Status page</a>.

    **Testing Card Payments**

    In order to test card payments on sandbox, please use credentials displayed on the <a href="/europe/docs/testing/sandbox/" target="_blank">Sandbox</a> documentation page.
servers:
  - url: https://secure.payu.com
    description: Production Server
  - url: https://secure.snd.payu.com
    description: Sandbox Test Server
security:
  - Bearer:
      - client_credentials
tags:
  - name: Authorize
    description: Authentication involves generating an OAuth token, which is used for further communication with PayU servers. To create a standard OAuth token, you will need <code>client_id</code> and <code>client_secret</code> keys, which can be found in your merchant panel, in the POS.
  - name: Payment-Methods
    x-displayName: Payment Methods
    description: Retrieving payment methods allows you to remove the threat of presenting a disabled payment method with white-label integration. It also gives you the ability to retrieve stored tokens and customer card data.
  - name: Order
    x-displayName: Order
    description: |
      Order is the basic payment request for the standard integration with PayU.

      > If the response to the payment creation request is returned with an **HTTP 200** status and in HTML format, make sure that the tool used to communicate with PayU has automatic redirect handling disabled.
      Only in this case it is possible to receive the correct JSON response with an **HTTP 302** status code.
  - name: Notifications
    x-displayName: Notifications
    description: |
      Notifications, also known as webhooks or IPNs (instant payment notifications), are messages sent by PayU to inform your server about order or refund status changes. 

      Notifications are sent only when <code>notifyUrl</code> parameter is provided in the order create request. Refund notifications use the same address as specified for the order.

      Optionally, you may request the notification for an order to be enriched with additional information.
      This may slightly increase the delivery time (as additional objects are being retrieved before notification is sent).
      In order to enrich the notifications add <code>settings.enrichNotificationsWith</code> to the order create request. Check <b>Order</b> section for more details.

      Note: order data provided in notification have the same model as the order returned in the order retrieve response (which can also be enriched).
  - name: Shop
    description: Shop is the main entity in the management panel. It is the place where you can manage incoming transactions processed by PayU.
  - name: Refund
    description: The PayU system fully supports refunds for the processed payments, the balance of which is transferred directly to the buyer's account.
  - name: Payout
    description: To widthraw funds from the PayU account you need to create a payout.
  - name: Token
    description: With tokenization, we are confident that your customers' card data is protected from third parties.
  - name: MCP
    x-displayName: Multi-Currency Pricing
    description: We can convert your customers' payments to the currency of your shop set up with PayU.
  - name: FX-Reference
    x-displayName: FX Reference
    description: According to regulations in the European Union countries, payment service providers and parties providing currency conversion services at the point of sale are obliged to express the total currency conversion charges as a percentage mark-up over the latest available euro foreign exchange reference rates issued by the European Central Bank (ECB).
  - name: Marketplace-Seller
    x-displayName: Marketplace Seller
    description: In PayU, as a marketplace, you have the capability to manage various aspects of your submerchants.
  - name: Marketplace-Verification
    x-displayName: Marketplace Verification
    description: PayU is required by the Anti-Money Laundering Act to verify customers in this context. For this purpose, we provide a collection of endpoints to make it easier for you to verify sellers.
  - name: Card Installments
    x-displayName: Card Installments
    description: Retrieve available card installments options for specific card. For merchants operating on the Romanian market (Requires contact with a Payu representative first).
  - name: Card
    x-displayName: Card
    description: Card related API operations allow advanced card data lookup and verifications.
  - name: ApplePay
    x-displayName: Apple Pay
    description: Operations related to Apple Pay integration.
  - name: Statements
    x-displayName: Statements
    description: Statements in PayU are comprehensive reports that provide a detailed summary of completed purchase transactions, refunds, and payouts.
  - name: Partner-Merchant-Registration
    x-displayName: Partner Merchant Registration
    description: Below are the endpoints that enable you to create the necessary entities (Firm, Url, Shop, POS) for your partner.
  - name: PF-Submerchant-Registration
    x-displayName: Payment Facilitator Submerchant Registration
    description: Payment Facilitator (PF) is an advanced form of partnership where PayU cedes much of its own responsibilities, like e.g. Know Your Customer (KYC) and verification, customer support and settlement (payouts) to the PF. Below are the endpoints for registering and handling PF submerchants.
paths:
  /pl/standard/user/oauth/authorize:
    post:
      tags:
        - Authorize
      summary: Create OAuth Token
      security: []
      description: |
        Each payment should be authorized in one of three available modes: 
        - <code>client_credentials</code> - used for standard integration,
        - <code>trusted_merchant</code> - used for authentication of requests made for logged-in shop/application users with fixed <code>extCustomerId</code>,
        - <code>partner</code> - special type of a token meant for creating entities (e.g. Shop, POS, URL) within partner firm.

        Generated access token is valid for 43199 seconds.
      operationId: oauth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              discriminator:
                propertyName: grant_type
                mapping:
                  client_credentials: '#/components/schemas/ClientCredentials'
                  trusted_merchant: '#/components/schemas/TrustedMerchant'
                  partner: '#/components/schemas/Partner'
              anyOf:
                - $ref: '#/components/schemas/ClientCredentials'
                - $ref: '#/components/schemas/TrustedMerchant'
                - $ref: '#/components/schemas/Partner'
      responses:
        '200':
          x-summary: OK
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: Token used for authentication of API calls.
                    format: uuid
                  token_type:
                    type: string
                    enum:
                      - bearer
                  refresh_token:
                    type: string
                    format: uuid
                  expires_in:
                    type: integer
                    description: Token expiration time (in seconds).
                    enum:
                      - 43199
                  grant_type:
                    type: string
                    description: Token authentication mode.
                    enum:
                      - client_credentials
                      - trusted_merchant
        '400':
          x-summary: Bad Request
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - error_description
                properties:
                  error:
                    type: string
                    description: Cause of the error.
                  error_description:
                    type: string
                    description: Error description.
        '401':
          x-summary: Unauthorized
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - error_description
                properties:
                  error:
                    type: string
                    description: Cause of the error.
                  error_description:
                    type: string
                    description: Error description.
  /api/v2_1/paymethods:
    get:
      tags:
        - Payment-Methods
      summary: Retrieve All Available Payment Methods.
      security:
        - Bearer:
            - client_credentials
            - trusted_merchant
      operationId: retrieve-payment-methods
      parameters:
        - name: lang
          in: query
          example:
            lang: pl
          description: Language code, ISO-639-1 compliant, determins language of description in <code>name</code> field
          required: false
          schema:
            type: string
          examples:
            lang:
              summary: lang parameter value example
              value:
                lang: pl
        - name: features
          in: query
          description: Determine the availability and parameters of specific features.
          required: false
          schema:
            type: string
          examples:
            features:
              summary: features parameter value example
              value:
                features: clickToPay
        - name: Content-Type
          in: header
          description: Content type
          required: true
          schema:
            type: string
          style: simple
          example: application/json
        - name: Authorization
          in: header
          description: Auth token
          required: true
          schema:
            type: string
          style: simple
          example: Bearer 3e5cac39-7e38-4139-8fd6-30adc06a61bd
      responses:
        '200':
          x-summary: OK
          description: ''
          content:
            application/json:
              schema:
                type: object
                description: Section containing payment methods available for the buyer.
                properties:
                  blikTokens:
                    $ref: '#/components/schemas/blikTokens'
                  cardTokens:
                    $ref: '#/components/schemas/cardTokens'
                  payByLinks:
                    $ref: '#/components/schemas/payByLinks'
                  status:
                    type: object
                    properties:
                      statusCode:
                        type: string
                        enum:
                          - SUCCESS
        '401':
          x-summary: Unauthorized
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
  /api/v2_1/orders:
    post:
      tags:
        - Order
      summary: Create an Order
      security:
        - Bearer:
            - client_credentials
            - trusted_merchant
      description: Create a new order request.
      operationId: create-an-order
      parameters:
        - name: Content-Type
          in: header
          description: Content type
          required: true
          schema:
            type: string
          style: simple
          example: application/json
        - name: Authorization
          in: header
          description: Auth token
          required: true
          schema:
            type: string
          style: simple
          example: Bearer 3e5cac39-7e38-4139-8fd6-30adc06a61bd
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Parameters for OrderCreateRequest
              required:
                - customerIp
                - merchantPosId
                - description
                - currencyCode
                - totalAmount
                - products
              properties:
                continueUrl:
                  type: string
                  description: Address for redirecting the customer after payment is commenced.
                  example: www.example.com/path
                  maxLength: 1024
                  format: RFC 3986
                notifyUrl:
                  type: string
                  description: The address for sending notifications
                  example: https://your.eshop.com/notify
                  maxLength: 1024
                  format: RFC 3986
                customerIp:
                  type: string
                  description: 'Payer''s IP address. Value is accepted in following formats:<ul> <li> **IPv4** - address represented in the dotted decimal format of 4 sets of decimal numbers separated by dots. The decimal number in each and every set is in the range 0 - 255. Example: 1.12.123.255.</li> <li> **IPv6** - address represented as eight groups of four hexadecimal digits, each group representing 16 bits (two octets). The groups are separated by colons (:). Example: 2011:0db8:85a3:0101:0101:8a2e:0370:7334.</li></ul>'
                  examples:
                    - 127.0.0.1
                    - 127.0.0.2
                    - 8d33:56b2:24aa:b822:9b2f:1db7:c21d:04e1
                merchantPosId:
                  type: string
                  description: Point of sale ID.
                  examples:
                    - '140332'
                    - '145227'
                description:
                  type: string
                  description: Description of the order.
                  maxLength: 4000
                additionalDescription:
                  type: string
                  description: Additional description of the order.
                  maxLength: 1024
                visibleDescription:
                  type: string
                  maxLength: 80
                  description: Order/Payment description visible for Buyer on the PayU payment page.
                statementDescription:
                  type: string
                  maxLength: 22
                  description: Payment recipient name followed by payment description (order ID, ticket number etc) visible on card statement. The name should be easy to recognize by the cardholder. If field is not provided, static name configured by PayU will be used.
                extOrderId:
                  type: string
                  description: ID of an order used in merchant system. Order identifier assigned by the merchant. It enables merchants to find a specific order in their system. This value must be unique within a single POS.
                  maxLength: 1024
                currencyCode:
                  type: string
                  description: Currency code compliant with ISO 4217 (e.g EUR).
                  examples:
                    - EUR
                    - PLN
                    - USD
                totalAmount:
                  type: string
                  description: Total price of the order in pennies (e.g. 1000 is 10.00 EUR). Applies also to currencies without subunits (e.g. 1000 is 10 HUF).
                  example: '1000'
                validityTime:
                  type: string
                  description: Duration for the validity of an order (in seconds), during which time payment must be made. Default value 86400.
                  example: '100000'
                cardOnFile:
                  type: string
                  description: Information about party initializing order or a transaction with Buyer consent to save card token. "cardOnFile" parameter cannot be used with "recurring" parameter.
                  enum:
                    - FIRST
                    - STANDARD_CARDHOLDER
                    - STANDARD_MERCHANT
                  example: FIRST
                recurring:
                  type: string
                  description: 'Marks the order as recurring payment: <ul> <li><b>FIRST</b> - payment initialized by the card owner who agreed to save card for future use in recurring plan. You can expect full authentication (3D Secure and/or CVV). If you want to use multi-use token (TOKC_) later, you have to be confident, that first recurring payment was successful.</li> <li><b>STANDARD</b> - subsequent recurring payment (user is not present). This transaction has multi use token (TOKC_). You cannot use it if FIRST recurring payment failed.</li> </ul> <b><code>recurring</code> parameter cannot be used with <code>cardOnFile</code> parameter</b> .'
                  enum:
                    - FIRST
                    - STANDARD
                  example: FIRST
                donation:
                  $ref: '#/components/schemas/donation'
                buyer:
                  $ref: '#/components/schemas/buyer'
                shoppingCarts:
                  $ref: '#/components/schemas/shoppingCarts'
                products:
                  $ref: '#/components/schemas/products'
                payMethods:
                  $ref: '#/components/schemas/payMethods'
                mcpData:
                  $ref: '#/components/schemas/mcpData'
                threeDsAuthentication:
                  $ref: '#/components/schemas/threeDsAuthentication'
                riskData:
                  $ref: '#/components/schemas/riskData'
                credit:
                  $ref: '#/components/schemas/credit'
                submerchant:
                  $ref: '#/components/schemas/submerchant'
                settings:
                  $ref: '#/components/schemas/settings'
                deviceFingerprint:
                  type: string
                  description: Hashed identifier of the user or its device.
                  example: 3e9fae0b3e6003a4093358167bc1079e
                  maxLength: 255
      responses:
        '201':
          x-summary: Created
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                oneOf:
                  - title: Payment without redirection
                    properties:
                      status:
                        type: object
                        properties:
                          statusCode:
                            type: string
                            example: SUCCESS
                      orderId:
                        type: string
                        description: Order identifier assigned by PayU.
                        example: WZHF5FFDRJ140731GUEST000P01
                      extOrderId:
                        type: string
                        description: Order identifier assigned by you.
                  - title: Payment with QR code
                    properties:
                      status:
                        type: object
                        properties:
                          statusCode:
                            type: string
                            example: WARNING_CONTINUE_QRCODE
                          severity:
                            type: string
                            example: WARNING
                      orderId:
                        type: string
                        description: Order identifier assigned by PayU.
                        example: WZHF5FFDRJ140731GUEST000P01
                      extOrderId:
                        type: string
                        description: Order identifier assigned by you.
                      qrCode:
                        type: string
                        description: QR code in base64 encoding.
                        example: c29tZUJhc2U2NGVuY29kZWRTdHJpbmc=
                  - title: Synchronous authorization result
                    properties:
                      status:
                        type: object
                        properties:
                          statusCode:
                            type: string
                            example: SUCCESS
                      orderId:
                        type: string
                        example: WZHF5FFDRJ140731GUEST000P01
                        description: Order identifier assigned by PayU.
                      extOrderId:
                        type: string
                        description: Order identifier assigned by you.
                      authorization:
                        type: object
                        description: Card authorization details.
                        properties:
                          amount:
                            type: string
                            example: 20000
                          status:
                            type: string
                            enum:
                              - AUTHORIZED
                              - SOFT_DECLINED
                              - REJECTED
                              - PENDING
                            example: AUTHORIZED
                          currencyCode:
                            type: string
                            description: Currency code compliant with ISO 4217.
                            example: PLN
                          responseCode:
                            type: string
                            description: Response code assigned by PayU.
                            example: '000'
                          responseCodeDescription:
                            type: string
                            description: Description of the response code.
                            example: 000 - OK
                          validUntil:
                            type: string
                            format: date-time
                            description: The date and time until authorization can be captured and order completed.
                            example: '2023-01-03T14:58:17.443+01:00'
                          card:
                            type: object
                            properties:
                              maskedNumber:
                                type: string
                                description: Masked card number.
                                example: 444433******1111
                              scheme:
                                type: string
                                description: 'Payment organization: MC (MasterCard/Maestro), VS (Visa).'
                                example: MC
                              issuerName:
                                type: string
                                description: Name of the card issuer.
                                example: Test Bank Ltd
                              countryCode:
                                type: string
                                description: Country for which the card was issued. Two-letter country code compliant with ISO-3166.
                                example: RO
                              classification:
                                type: string
                                description: Card classification (e.g. DEBIT, CREDIT).
                                example: DEBIT
                              profile:
                                type: string
                                description: Card profile (e.g. CONSUMER, BUSINESS).
                                example: CONSUMER
        '302':
          x-summary: Found
          description: ''
          content:
            application/json:
              schema:
                type: object
                oneOf:
                  - title: Redirection to payment page
                    properties:
                      status:
                        type: object
                        properties:
                          statusCode:
                            type: string
                            description: Response code
                            example: SUCCESS
                      redirectUri:
                        type: string
                        description: Url redirection to the payment page.
                        example: https://merch-prod.snd.payu.com/pay/?orderId=WZHF5FFDRJ140731GUEST000P01&token=eyJhbGciOiJIUzI1NiJ9..tBThoQDVgo9mpmh2AUDC5hkfecwtqO0L9LSCdXRYruk
                      orderId:
                        type: string
                        description: Order identifier assigned by PayU.
                        example: WZHF5FFDRJ140731GUEST000P01
                      extOrderId:
                        type: string
                        description: Order identifier assigned by merchant.
                        example: my_ext_order_id
                  - title: Redirection to 3DS authentication page
                    properties:
                      status:
                        type: object
                        properties:
                          statusCode:
                            type: string
                            description: Response code
                            example: WARNING_CONTINUE_3DS
                          severity:
                            type: string
                            example: WARNING
                      redirectUri:
                        type: string
                        description: Url redirection to the 3DS authentication page.
                        example: https://merch-prod.snd.payu.com/front/threeds/?authenticationId=string
                      iframeAllowed:
                        type: boolean
                        description: Indicates whether 3DS authentication page can be displayed in iframe.
                        example: true
                      threeDsProtocolVersion:
                        type: string
                        enum:
                          - 3DS2
                      orderId:
                        type: string
                        description: Order identifier assigned by PayU.
                        example: WZHF5FFDRJ140731GUEST000P01
                      extOrderId:
                        type: string
                        description: Order identifier assigned by merchant.
                        example: my_ext_order_id
                      payMethods:
                        type: object
                        description: Optional. Contains card token details if it was created.
                        properties:
                          payMethod:
                            type: object
                            properties:
                              card:
                                type: object
                                properties:
                                  number:
                                    type: string
                                    description: Card number.
                                    example: 4444333322221111
                                  expirationMonth:
                                    type: integer
                                    description: Card expiration month.
                                    example: 9
                                  expirationYear:
                                    type: integer
                                    description: Card expiration year.
                                    example: 2026
                              type:
                                type: string
                                enum:
                                  - CARD_TOKEN
                              value:
                                type: string
                                example: TOKC_XATB7DF8ACXYTVQIPLWTVPFRKQE
                  - title: Redirection to PayPal
                    properties:
                      status:
                        type: object
                        properties:
                          statusCode:
                            type: string
                            description: Response code
                            example: SUCCESS
                      redirectUri:
                        type: string
                        description: Url redirection to the payment page.
                        example: https://merch-prod.snd.payu.com/pay/?orderId=WZHF5FFDRJ140731GUEST000P01&token=eyJhbGciOiJIUzI1NiJ9..tBThoQDVgo9mpmh2AUDC5hkfecwtqO0L9LSCdXRYruk
                      orderId:
                        type: string
                        description: Order identifier assigned by PayU.
                        example: WZHF5FFDRJ140731GUEST000P01
                      extOrderId:
                        type: string
                        description: Order identifier assigned by merchant.
                        example: my_ext_order_id
                      authorization:
                        type: object
                        description: PayPal authorization details.
                        properties:
                          amount:
                            type: string
                            description: Amount to be authorized.
                            example: '4200'
                          currencyCode:
                            type: string
                            description: Currency code compliant with ISO 4217.
                            example: EUR
                          status:
                            type: string
                            description: Status of the authorization.
                            example: PENDING
                          createDate:
                            type: string
                            description: Authorization creation timestamp.
                            example: '2023-01-03T14:58:17.443+01:00'
                          validUntil:
                            type: string
                            description: Date until successful authorization may be captured and order completed.
                            example: '2023-01-03T14:58:17.443+01:00'
                          serviceProcessingType:
                            type: string
                            description: Indicates whether PayU acts as payment service provider (PSP) to process and settle the payment, or is technical service provider (TSP) only.
                            enum:
                              - PSP
                              - TSP
                            example: PSP
                          payType:
                            type: string
                            description: Type of payment method used.
                            example: paypal
                          payTypeDetails:
                            type: object
                            properties:
                              orderId:
                                type: string
                                description: Order identifier assigned by PayPal.
                                example: 6UP08952RE458370L
                              invoiceId:
                                type: string
                                description: Invoice identifier within PayPal system, assigned by PayU (equals to PayU payment id).
                                example: '1234567890'
        '400':
          x-summary: Bad Request
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400'
        '401':
          x-summary: Unauthorized
          description: Incorrect authentication. Check signature parameters and implementation of the signature algorithm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401'
        '403':
          x-summary: Forbidden
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403'
        '500':
          x-summary: Internal server error
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
  /api/v2_1/orders/{orderId}:
    get:
      tags:
        - Order
      summary: Retrieve an Order
      description: |
        Retrieve status and details of an order. By adding query parameter <code>with</code>, you can enrich order data with additional information.
        Enrichment may slightly increase the response time.

        Note: retrieved order data have the same model as the order data sent in notifications (which can also be enriched).
      operationId: retrieve-an-order
      parameters:
        - name: orderId
          in: path
          example: WZHF5FFDRJ140731GUEST000P01
          description: Order ID generated by the PayU system
          required: true
          content:
