  /your-notify-url:
    post:
      tags:
        - Notifications
      summary: order/refund status change
      description: Order Status Change Notification
      operationId: OrderStatusChangeNotification
      parameters:
        - name: Content-Type
          in: header
          description: Content type
          schema:
            type: string
          style: simple
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - title: order
                  type: object
                  properties:
                    order:
                      $ref: '#/components/schemas/order'
                    properties:
                      $ref: '#/components/schemas/properties'
                - title: enriched order
                  type: object
                  properties:
                    order:
                      $ref: '#/components/schemas/enriched_order'
                    properties:
                      $ref: '#/components/schemas/properties'
                - title: refund
                  type: object
                  properties:
                    orderId:
                      type: string
                      description: Order ID generated by the PayU system
                      example: WZHF5FFDRJ140731GUEST000P01
                    extOrderId:
                      type: string
                      description: Order ID generated by the merchant
                      example: 60091447720_1780417344937
                    refund:
                      type: object
                      properties:
                        refundId:
                          type: string
                          description: Refund ID generated by the PayU system
                          example: 197008339
                        extRefundId:
                          type: string
                          description: Refund ID generated by the merchant
                          example: abc123
                        amount:
                          type: string
                          description: Refund amount in minor units (e.g., 10000 for 100.00 PLN)
                          example: 56544
                        currencyCode:
                          type: string
                          description: ISO 4217 currency code
                          example: PLN
                        status:
                          type: string
                          enum:
                            - FINALIZED
                            - CANCELLED
                          example: FINALIZED
                        statusDateTime:
                          type: string
                          format: date-time
                          description: Date and time of the last refund status change
                          example: '2026-06-06T13:55:01.587+02:00'
                        reason:
                          type: string
                          description: Refund reason code
                          example: refund
                        reasonDescription:
                          type: string
                          description: Refund description (provided by the merchant or PayU)
                          example: 'Refund for order #60091447720'
                        refundDate:
                          type: string
                          format: date-time
                          description: Date and time when the refund was created
                          example: '2026-06-06T13:54:13.010+02:00'
      responses:
        '200':
          x-summary: OK
          description: You should respond with HTTP 200 status code to acknowledge that you have received the notification. Otherwise, PayU will retry sending the notification with increasing intervals.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
    Basic:
      type: http
      scheme: basic
  schemas:
    '200':
      type: object
      description: ''
      properties:
        verificationId:
          type: string
          description: ''
          example: 5002500000BVmycAAD
        verificationType:
          type: string
          description: ''
          example: FULL
        verificationTransferStatus:
          type: string
          description: |
            Indicates status of the verification transfer.
            * **Success** - transfer was received by PayU.
            * **Failure** - PayU did not received funds
            * **Matched** - transfer has been matched properly.
            * **null** - did not have enough information about the transfer.
          enum:
            - Success
            - Failure
            - Matched
            - 'null'
          example: 'null'
        processType:
          type: string
          description: Type of the process.
          enum:
            - OCCASIONAL
            - REGULAR
          example: OCCASIONAL
        status:
          type: string
          description: 'Possible statuses: <ul> <li><b>POSITIVE</b> - indicates that the seller is accepted and can process transactions with PayU.</li> <li><b>NEGATIVE</b> - indicates that the seller is rejected and can''t process transactions with PayU. There is an error code always send for negative scenario.</li> <li><b>REJECTED</b> -  indicates that provided data must be corrected.</li> <li><b>WAITING_FOR_DATA</b> - waiting for data is sent in the notification when the verification was initialized but the request to start verification was not yet received. Provide the necessary data and documents according to the type of submerchant and send POST request on <code complete</code> endpoint.</li> <li><b>WAITING_FOR_VERIFICATION</b> - waiting for verification indicates that data and documents submitted to PayU will be verified by PayU or  currently being verified. Wait for notification about status change.</li> <li><b>CANCELED</b> - canceled. Initiate new verification when it is necessary. Marketplace can not cancel verification intialized by PayU or after sending complete information.</li> </ul>'
          example: REJECTED
        sellerId:
          type: string
          description: ''
          example: 123456test12
        note:
          type: string
          description: ''
          example: null
        errors:
          type: array
          description: ''
          items:
            type: object
            properties:
              content:
                type: object
                description: Group of fields that indicate which data/document the error code applies to.
                properties:
                  itemType:
                    type: string
                    description: ''
                    enum:
                      - SELLER
                      - SELLER_DOCUMENT
                      - ASSOCIATE
                      - ASSOCIATE_DOCUMENT
                      - PAYOUT_ACCOUNT
                    example: SELLER_DOCUMENT
                  itemProperties:
                    type: object
                    description: ''
                    properties:
                      documentType:
                        type: string
                        description: ''
                        enum:
                          - ID_CARD
                          - PASSPORT
                          - DRIVING_LICENCE
                          - RESIDENCE_PERMIT
                          - OTHER
                        example: PEP_STATEMENT
                      documentId:
                        type: string
                        description: ''
                        example: '2'
                      associateId:
                        type: string
                        description: ''
                        example: null
              code:
                type: string
                description: Error Code.
                example: '006'
        updateDate:
          type: string
          description: ''
          example: '2020-04-03T09:14:06.000Z'
        createDate:
          type: string
          description: ''
          example: '2020-04-03T06:36:15.000Z'
    '400':
      type: object
      properties:
        status:
          type: object
          properties:
            statusCode:
              type: string
              description: Error type.
            severity:
              type: string
              description: error severity type.
            code:
              type: string
              description: Identification code of specific error.
            codeLiteral:
              type: string
              description: Cause of the error.
            statusDesc:
              type: string
              description: Error description.
    '401':
      type: object
      properties:
        status:
          type: object
          properties:
            statusCode:
              type: string
              description: Error type.
            code:
              type: string
              description: Identification code of specific error.
            codeLiteral:
              type: string
              description: Cause of the error.
            statusDesc:
              type: string
              description: Error description.
    '403':
      type: object
      properties:
        status:
          type: object
          properties:
            error:
              type: string
              description: Error type.
              enum:
                - access_denied
            error_description:
              type: string
              description: Description of error.
              enum:
                - Access is denied
    '404':
      type: object
      properties:
        status:
          type: object
          properties:
            statusCode:
              type: string
              description: Error type.
            severity:
              type: string
              description: error severity type.
            statusDesc:
              type: string
              description: Error description.
    '409':
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: string
              description: Error type.
              example: '409'
            message:
              type: string
              description: Error message.
    '429':
      type: object
      properties:
        status:
          type: object
          properties:
            statusCode:
              type: string
              description: Error type.
            code:
              type: string
              description: Identification code of specific error.
            codeLiteral:
              type: string
              description: Cause of the error.
            statusDesc:
              type: string
              description: Error description.
    '500':
      type: object
      properties:
        status:
          type: object
          properties:
            statusCode:
              type: string
              description: Error type.
            code:
              type: string
              description: Identification code of specific error.
            codeLiteral:
              type: string
              description: Cause of the error.
            statusDesc:
              type: string
              description: Error description.
    ClientCredentials:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          example: client_credentials
          enum:
            - client_credenitals
          description: Authorization mode
        client_id:
          type: string
          example: '145227'
          description: Merchant's POS identifier in PayU's system. Can be found in PayU's merchant panel
        client_secret:
          type: string
          example: 12f071174cb7eb79d4aac5bc2f07563f
          description: Merchant's secret key. Can be found in PayU's merchant panel
    TrustedMerchant:
