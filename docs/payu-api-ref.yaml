  responses:
    '200':
      x-summary: OK
      description: Card identified. Card characteristics returned in the response body.
      content:
        application/json:
          schema:
            type: object
            properties:
              maskedNumber:
                type: string
                description: |
                  Masked card number (for example `536447******6443`).

                  **Note**: For network-tokenized cards (Visa/Mastercard), only the last 4 digits may be visible.
                example: 536447******6443
              expirationMonth:
                type: integer
                description: Card expiration month.
                example: 8
              expirationYear:
                type: integer
                description: Card expiration year.
                example: 2029
              scheme:
                type: string
                description: |
                  Payment organization (card scheme):
                  - `MC` (Mastercard/Maestro)
                  - `VS` (Visa)
                enum:
                  - MC
                  - VS
                example: MC
              description:
                type: string
                description: Card product description from the BIN table (for example `World Debit Mastercard Card`, `Visa Infinite`).
                example: World Debit Mastercard Card
              type:
                type: string
                description: |
                  Card product type code from the payment organization's BIN table (for example `MDH`, `I`, `I1`).

                  For details, refer to official Visa or Mastercard documentation.
                example: MDH
              countryCode:
                type: string
                description: Card country code, ISO 3166-1 alpha-2 (for example `PL`, `RO`).
                example: RO
              classification:
                type: string
                description: Card classification.
                enum:
                  - DEBIT
                  - PREPAID
                  - CREDIT
                  - CHARGE
                example: DEBIT
              profile:
                type: string
                description: Card profile.
                enum:
                  - BUSINESS
                  - CONSUMER
                  - BOTH
                example: CONSUMER
              uniqueReference:
                type: string
                description: |
                  Unique immutable identifier of the physical card number (PAN).
                  The same PAN always yields the same value, regardless of the token used.
                  Useful for detecting the same card saved on multiple accounts.

                  Maximum length is 256 characters.

                  **Note**: For network-tokenized cards (Visa/Mastercard), PayU may not always know the real PAN
                  due to instrument nature (for example Apple Pay or network token has been updated by Issuer and pushed to PayU with new data for lost card scenario) or token lifecycle updates.
                  In such cases, PayU cannot guarantee full immutability of unique reference.
                maxLength: 256
                example: b75ddfb250cd8d9a647fa787718ec67f3f984d54bb51432373427c0e874f68c42438945f330bd6be07f3b41fde422fb548ccbe23c9cb51d0c1792ec7004ed23e
              issuer:
                type: object
                description: Card issuer data.
                properties:
                  name:
                    type: string
                    description: Issuer name.
                    example: SUPER BANK LIMITED
                  region:
                    type: string
                    description: |
                      Issuer region within the card scheme.

                      **Note**: Mastercard and Visa use different regional definitions.
                      For selected European countries, Visa-specific `V6_CE_EUROPE_MID_EAST_AND_AFRICA`
                      may be returned.
                    enum:
                      - UNITED_STATES
                      - CANADA
                      - ASIA_PACIFIC
                      - LATING_AMERICA_AND_CARIBBEAN
                      - EUROPE
                      - V6_CE_EUROPE_MID_EAST_AND_AFRICA
                      - ME_SOUTH_ASIA_MID_EAST_AFRICA
                    example: EUROPE
                  countryCode:
                    type: string
                    description: |
                      Issuer country code, ISO 3166-1 alpha-2 (for example `PL`, `RO`).

                      **Note**: Can differ from card `countryCode`, especially for fintechs operating
                      across regions under one country's license (for example EEA).
                    example: RO
              installmentOptions:
                type: object
                description: Retrieve available card installments options for a specific card. Available for merchants operating on the Romanian market (requires contact with a PayU representative first).
                properties:
                  numbers:
                    type: array
                    description: Section containing available installments options (for example `[1, 6, 12]`).
                    items:
                      type: integer
                    example:
                      - 1
                      - 6
                      - 12
                      - 20
                      - 21
                      - 22
                      - 23
                      - 24
                  provider:
                    type: string
                    description: Card installments program provider.
                    example: SUPERBANK
                  settings:
                    type: object
                    description: Object representing provider-specific settings.
                    properties:
                      minAmount:
                        type: number
                        description: If returned for a given card BIN, the order amount must be higher than this value to use the installment plan; if lower or equal, the order is rejected.
                        example: 60000
          examples:
            ok:
              summary: 200 - OK
              value:
                maskedNumber: 536447******6443
                expirationMonth: 8
                expirationYear: 2029
                scheme: MC
                description: World Debit Mastercard Card
                type: MDH
                countryCode: RO
                classification: DEBIT
                profile: CONSUMER
                uniqueReference: b75ddfb250cd8d9a647fa787718ec67f3f984d54bb51432373427c0e874f68c42438945f330bd6be07f3b41fde422fb548ccbe23c9cb51d0c1792ec7004ed23e
                issuer:
                  name: SUPER BANK LIMITED
                  region: EUROPE
                  countryCode: RO
                installmentOptions:
                  numbers:
                    - 1
                    - 6
                    - 12
                    - 20
                    - 21
                    - 22
                    - 23
                    - 24
                  provider: SUPERBANK
                  settings:
                    minAmount: 60000
    '400':
      x-summary: Bad Request
      description: Request validation error (for example missing both `token` and `card`, providing both `token` and `card`, malformed card number or expiration date, invalid token format).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/400'
          examples:
            validationError:
              summary: 400 - Bad Request (validation error)
              value:
                status:
                  statusCode: ERROR_VALUE_INVALID
                  statusDesc: TOKEN_OR_CARD_DATA_REQUIRED
                  severity: ERROR
                  code: '108'
                  codeLiteral: ERROR_VALUE_INVALID
    '401':
      x-summary: Unauthorized
      description: Missing or invalid OAuth bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/401'
          examples:
            unauthorized:
              summary: 401 - Unauthorized
              value:
                status:
                  statusCode: UNAUTHORIZED
                  statusDesc: Incorrect authentication
                  code: '401'
                  codeLiteral: INVALID_OR_MISSING_ACCESS_TOKEN
    '403':
      x-summary: Forbidden
      description: The POS is not allowed to use the Card Data API.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  statusCode:
                    type: string
                  statusDesc:
                    type: string
                  code:
                    type: string
                  codeLiteral:
                    type: string
          examples:
            forbidden:
              summary: 403 - Forbidden
              value:
                status:
                  statusCode: FORBIDDEN
                  statusDesc: Card Data API service is unavailable for shopId=X. To enable this service, please contact PayU through your Account Manager or use our contact form.
                  code: '403'
                  codeLiteral: SERVICE_NOT_ACTIVE
    '404':
      x-summary: Not Found
      description: Card could not be identified or no data is available for the given card number.
      content:
        application/json:
          schema:
            type: object
          examples:
            notFound:
              summary: 404 - Not Found
              value: {}
    '408':
      x-summary: Request Timeout
      description: Cannot complete request, please try again.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  statusCode:
                    type: string
                  statusDesc:
                    type: string
                  code:
                    type: string
                  codeLiteral:
                    type: string
          examples:
            timeout:
              summary: 408 - Request timeout
              value:
                status:
                  statusCode: REQUEST_TIMEOUT
                  statusDesc: Cannot complete request, please try again.
                  code: '408'
                  codeLiteral: SERVICE_NOT_AVAILABLE
    '429':
      x-summary: Too Many Requests
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          schema:
            type: integer
            example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/429'
          examples:
            tooManyRequests:
              summary: 429 - Too many requests
              value:
                status:
                  statusCode: TOO_MANY_REQUESTS
                  code: '429'
                  codeLiteral: SERVICE_NOT_AVAILABLE
                  statusDesc: Too many requests. Wait the number of seconds given in Retry-After before retrying.
    '500':
      x-summary: Internal Server Error
      description: Unexpected error on PayU side. Retry the request later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/500'
          examples:
            internalError:
              summary: 5xx - Server error
              value:
                status:
                  statusCode: GENERAL_ERROR
                  statusDesc: Unexpected error
                  code: '100'
                  codeLiteral: GENERAL_ERROR
